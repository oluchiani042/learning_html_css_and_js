<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login page</title>
    <link rel="stylesheet" href="./login page.css" />
  </head>
  <body>
    <div class="container">
      <div class="left-panel">
        <div class="img">
          <div class="overlay">
            <h1>
              Create Your <br />
              Account
            </h1>
            <p>Share your artwork and Get projects!</p>
          </div>
        </div>
      </div>
      <div class="right-panel">
        <h2>Sign Up</h2>

        <form action="">
          <input type="text" required placeholder="Firstname" />
          <input type="text" required placeholder="Lastname" />
          <input type="email" required placeholder="Email address" />
          <input type="password" required placeholder="Password" />
          <div class="check">
            <input type="checkbox" class="checkme" /> <span>Accept terms & Conditions</span>
          </div>
          <button class="primary-btn">Join us</button>
          <div class="lineCon">
            <div class="line"></div>
            <div class="divider">or</div>
          </div>

          <button class="google-btn">Sign Up With Google</button>
          <button class="apple-btn">Sign Up With Apple</button>
        </form>
      </div>
    </div>
  </body>
</html>
